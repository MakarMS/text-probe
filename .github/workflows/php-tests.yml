name: PHP Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.1'
            phpunit-version: '10.5'
          - php-version: '8.2'
            phpunit-version: '11.5'
          - php-version: '8.3'
            phpunit-version: '12.5'
          - php-version: '8.4'
            phpunit-version: '13.4'
          - php-version: '8.5'
            phpunit-version: '13.4'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PHP and standalone PHPUnit
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom
          tools: composer, phpunit:${{ matrix.phpunit-version }}
          coverage: none

      - name: Install library dependencies
        env:
          COMPOSER: composer.runtime.json
        run: |
          jq 'del(."require-dev", .scripts)' composer.json > "$COMPOSER"
          composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: |
          phpunit --no-configuration --bootstrap vendor/autoload.php \
            --disallow-test-output --fail-on-risky --fail-on-warning tests

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          extensions: mbstring, dom
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
