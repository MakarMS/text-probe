name: Infection (Mutation Testing)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  infection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          coverage: xdebug
          extensions: pcntl

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare baseline coverage
        run: |
          mkdir -p build
          vendor/bin/phpunit \
            --coverage-xml=build/coverage-xml \
            --log-junit=build/phpunit.junit.xml
        env:
          XDEBUG_MODE: coverage

      - name: Run Infection
        run: php -d memory_limit=512M vendor/bin/infection --threads=4 --coverage=build --no-progress
