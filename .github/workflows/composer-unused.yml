name: Composer Unused

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  composer-unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run composer-unused
        run: vendor/bin/composer-unused --no-interaction --ansi
